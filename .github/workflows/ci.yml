name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: mvn -B verify
      - name: Generate Javadoc
        run: mvn -B javadoc:javadoc
      - name: Run complete training and generation example
        run: mvn -B exec:java -Dexec.mainClass=com.javiergs.llm.training.TrainAndGenerateExample
